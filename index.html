<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Joy Fullscreen Stack Motion</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    .nav {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      z-index: 80;
      display: flex;
      justify-content: space-between;
      padding: 14px 18px;
      font-size: 11px;
      text-transform: uppercase;
      mix-blend-mode: difference;
      pointer-events: none;
    }
    .stage {
      height: 820vh;
      position: relative;
      background: #050505;
    }
    .pin {
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: hidden;
      background: #050505;
    }
    .portfolio-title {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      opacity: 1;
      transform: translateY(var(--title-y, 0px)) scale(var(--title-scale, 1));
    }
    h1 {
      margin: 0;
      font-size: clamp(58px, 12vw, 172px);
      line-height: .82;
      letter-spacing: -6px;
      text-transform: uppercase;
      text-align: center;
      font-weight: 800;
    }
    .serif {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      color: #7a0c07;
    }
    .vertical-curtain {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--curtain-width, 24px);
      height: var(--curtain-height, 0vh);
      z-index: 3;
      background: #7a0c07;
      transform: translate(-50%, -50%);
      transform-origin: 50% 50%;
    }
    .curtain-split {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      grid-template-columns: 1fr 1fr;
      opacity: var(--split-opacity, 0);
      pointer-events: none;
    }
    .curtain-split div { background: #7a0c07; }
    .curtain-split .left { transform: translateX(calc(var(--curtain-open, 0) * -100%)); }
    .curtain-split .right { transform: translateX(calc(var(--curtain-open, 0) * 100%)); }

    .card-layer,
    .text-layer {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
    }
    .stack-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--panel-width, 0vw);
      height: var(--panel-height, 0vh);
      transform: translate(-50%, -50%);
      background:
        linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,0)),
        #111;
      border: 1px solid rgba(255,255,255,.20);
      box-shadow: 0 24px 90px rgba(0,0,0,.34);
      overflow: hidden;
      opacity: var(--card-opacity, 0);
      will-change: width, height, opacity;
    }
    .stack-card:nth-child(1) {
      background:
        linear-gradient(135deg, rgba(255,255,255,.08), rgba(0,0,0,.45)),
        repeating-linear-gradient(90deg, #242424 0 70px, #191919 70px 140px);
      z-index: 1;
    }
    .stack-card:nth-child(2) { background: #7a0c07; z-index: 2; }
    .stack-card:nth-child(3) {
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.88), rgba(255,255,255,0) 30%),
        #d8d8d8;
      z-index: 3;
    }
    .stack-card:nth-child(4) {
      background:
        linear-gradient(135deg, rgba(255,255,255,.12), rgba(0,0,0,.42)),
        #171717;
      z-index: 4;
    }
    .stack-card:nth-child(5) { background: #9f1a12; z-index: 5; }
    .stack-card:nth-child(6) {
      background:
        linear-gradient(135deg, rgba(85, 85, 85, 0.9), rgba(70, 70, 70, 0.55)),
        #f4f4f4;
      z-index: 6;
    }

    .stack-text {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 20;
      transform:
        translate(-50%, -50%)
        translate(
          calc(var(--text-x, 0) * 1px),
          calc(var(--text-y, 0) * 1px)
        )
        scale(var(--text-scale, 0));
      transform-origin: 50% 50%;
      font-size: clamp(30px, 7vw, 108px);
      line-height: .82;
      letter-spacing: -4px;
      text-transform: uppercase;
      font-weight: 800;
      color: #fff;
      mix-blend-mode: difference;
      white-space: nowrap;
      opacity: var(--text-opacity, 0);
      will-change: transform, opacity;
    }
    .stack-text:nth-child(1) { --target-y: -300; }
    .stack-text:nth-child(2) { --target-y: -190; }
    .stack-text:nth-child(3) { --target-y: -80; }
    .stack-text:nth-child(4) { --target-y: 30; }
    .stack-text:nth-child(5) { --target-y: 140; }
    .stack-text:nth-child(6) { --target-y: 250; }

    .dock-copy {
      position: absolute;
      right: 7vw;
      bottom: 12vh;
      z-index: 30;
      width: min(38vw, 520px);
      opacity: var(--dock-copy-opacity, 0);
      transform: translateY(calc((1 - var(--dock-copy-opacity, 0)) * 40px));
      mix-blend-mode: difference;
    }
    .dock-copy h2 {
      margin: 0;
      font-size: clamp(34px, 5.5vw, 84px);
      line-height: .88;
      letter-spacing: -3px;
      text-transform: uppercase;
    }
    .dock-copy p {
      margin: 18px 0 0;
      max-width: 420px;
      color: #d8d8d8;
      font-size: 13px;
      line-height: 1.45;
      text-transform: uppercase;
    }
    .progress {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 90;
      width: 180px;
      height: 2px;
      background: rgba(255,255,255,.24);
      mix-blend-mode: difference;
    }
    .bar {
      height: 100%;
      width: calc(var(--p, 0) * 100%);
      background: #fff;
    }
    .next {
      min-height: 100vh;
      padding: 90px 18px;
      background: #f2f2f2;
      color: #050505;
    }
    .next h2 {
      margin: 0;
      font-size: clamp(42px, 8vw, 106px);
      line-height: .86;
      letter-spacing: -4px;
      text-transform: uppercase;
    }
    @media (max-width: 780px) {
      .nav {
        padding: 12px;
        font-size: 9px;
      }
      .nav span:nth-child(2) {
        display: none;
      }
      h1 {
        font-size: clamp(48px, 19vw, 82px);
        letter-spacing: -3px;
      }
      .stack-text {
        font-size: clamp(24px, 11vw, 48px);
        letter-spacing: -2px;
      }
      .stack-text:nth-child(1) { --target-y: -230; }
      .stack-text:nth-child(2) { --target-y: -146; }
      .stack-text:nth-child(3) { --target-y: -62; }
      .stack-text:nth-child(4) { --target-y: 22; }
      .stack-text:nth-child(5) { --target-y: 106; }
      .stack-text:nth-child(6) { --target-y: 190; }
      .dock-copy {
        left: 18px;
        right: 18px;
        bottom: 7vh;
        width: auto;
      }
      .dock-copy h2 {
        font-size: clamp(32px, 13vw, 58px);
        letter-spacing: -2px;
      }
      .dock-copy p {
        max-width: 30ch;
        font-size: 11px;
      }
      .progress {
        left: 18px;
        right: 18px;
        width: auto;
      }
    }

    @media (min-width: 781px) and (max-width: 1023px) {
      h1 {
        font-size: clamp(82px, 13vw, 132px);
      }
      .stack-text {
        font-size: clamp(34px, 7.5vw, 74px);
      }
      .dock-copy {
        right: 5vw;
        width: min(42vw, 420px);
      }
    }
  </style>
</head>
<body>
  <div class="nav">
    <span>[ + ] Joy</span>
    <span>Fullscreen stack reveal</span>
    <span>Scroll scrub</span>
  </div>
  <div class="progress"><div class="bar"></div></div>

  <main>
    <section class="stage" id="stage">
      <div class="pin">
        <div class="portfolio-title">
          <h1>Joy's<br><span class="serif">Portfolio</span></h1>
        </div>

        <div class="vertical-curtain"></div>
        <div class="curtain-split">
          <div class="left"></div>
          <div class="right"></div>
        </div>

        <div class="card-layer">
          <div class="stack-card" data-i="0"></div>
          <div class="stack-card" data-i="1"></div>
          <div class="stack-card" data-i="2"></div>
          <div class="stack-card" data-i="3"></div>
          <div class="stack-card" data-i="4"></div>
          <div class="stack-card" data-i="5"></div>
        </div>

        <div class="text-layer">
          <div class="stack-text" data-i="0">React</div>
          <div class="stack-text" data-i="1">Next.js</div>
          <div class="stack-text" data-i="2">TypeScript</div>
          <div class="stack-text" data-i="3">NestJS</div>
          <div class="stack-text" data-i="4">MariaDB</div>
          <div class="stack-text" data-i="5">CSS</div>
        </div>

        <div class="dock-copy">
          <h2>Frontend<br><span class="serif">Product</span><br>Builder</h2>
          <p>Each square expands to cover the viewport. Each label starts docking as soon as it reaches its readable size.</p>
        </div>
      </div>
    </section>

    <section class="next">
      <h2>Project cases start here.</h2>
    </section>
  </main>

  <script>
    const stage = document.getElementById('stage');
    const root = document.documentElement;
    const cards = [...document.querySelectorAll('.stack-card')];
    const texts = [...document.querySelectorAll('.stack-text')];
    const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const map = (p, inA, inB, outA, outB) => lerp(outA, outB, clamp((p - inA) / (inB - inA)));
    const easeOut = (t) => 1 - Math.pow(1 - t, 4);
    const easeOutExpo = (t) => t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
    const easeSoft = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOut = (t) => t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
    const debugProgress = new URLSearchParams(location.search).get('p');
    let targetProgress = 0;
    let renderProgress = 0;

    function itemMotion(p, index) {
      const start = 0.22 + index * 0.040;
      const grow = easeSoft(map(p, start, start + 0.190, 0, 1));
      const textIn = easeOutExpo(map(p, start + 0.004, start + 0.030, 0, 1));
      const dock = easeInOut(map(p, start + 0.014, start + 0.074, 0, 1));
      return { grow, textIn, dock };
    }

    function updateTarget() {
      if (debugProgress !== null) {
        targetProgress = clamp(Number(debugProgress));
        return;
      }
      const rect = stage.getBoundingClientRect();
      const scrollable = rect.height - window.innerHeight;
      targetProgress = clamp(-rect.top / scrollable);
    }

    function render() {
      updateTarget();
      renderProgress += (targetProgress - renderProgress) * 0.12;
      const p = renderProgress;

      const titleGrow = easeSoft(map(p, 0.02, 0.55, 0, 1));
      const curtainHeight = easeInOut(map(p, 0.06, 0.16, 0, 1));
      const curtainGrow = easeInOut(map(p, 0.16, 0.30, 0, 1));
      const curtainOpen = easeInOut(map(p, 0.28, 0.40, 0, 1));

      root.style.setProperty('--p', p.toFixed(4));
      root.style.setProperty('--title-y', '0px');
      root.style.setProperty('--title-scale', lerp(0.5, 3.50, titleGrow).toFixed(4));
      root.style.setProperty('--curtain-height', `${lerp(0, 100, curtainHeight).toFixed(2)}vh`);
      root.style.setProperty('--curtain-width', `${lerp(12, window.innerWidth, curtainGrow).toFixed(2)}px`);
      // root.style.setProperty('--split-opacity', map(curtainGrow, .82, 1, 0, 1).toFixed(4));
      root.style.setProperty('--curtain-open', curtainOpen.toFixed(4));
      root.style.setProperty('--dock-copy-opacity', easeOut(map(p, 0.90, 1, 0, 1)).toFixed(4));

      cards.forEach((card, index) => {
        const { grow } = itemMotion(p, index);
        const visible = map(grow, 0, .08, 0, 1);
        const scale = lerp(0.02, 1.12, grow);
        card.style.setProperty('--panel-width', `${(scale * 100).toFixed(2)}vw`);
        card.style.setProperty('--panel-height', `${(scale * 100).toFixed(2)}vh`);
        card.style.setProperty('--card-opacity', visible.toFixed(3));
      });

      texts.forEach((text, index) => {
        const { grow, textIn, dock } = itemMotion(p, index);
        const targetY = Number(getComputedStyle(text).getPropertyValue('--target-y')) || 0;
        const dockTargetX = window.innerWidth <= 780 ? -window.innerWidth * 0.34 : -window.innerWidth * 0.36;
        const dockX = lerp(0, dockTargetX, dock);
        const dockY = lerp(0, targetY, dock);
        const scale = lerp(0, 1, textIn) * lerp(1, .34, dock);
        const opacity = grow > 0.01 ? 1 : 0;
        text.style.setProperty('--text-scale', scale.toFixed(4));
        text.style.setProperty('--text-x', dockX.toFixed(2));
        text.style.setProperty('--text-y', dockY.toFixed(2));
        text.style.setProperty('--text-opacity', opacity.toFixed(4));
      });

      requestAnimationFrame(render);
    }

    updateTarget();
    renderProgress = targetProgress;
    requestAnimationFrame(render);
    window.addEventListener('resize', updateTarget);
  </script>
</body>
</html>
